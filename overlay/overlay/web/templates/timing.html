<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iRacing Timing Tower</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/timing.css">
    <style>

    </style>
</head>

<body>

    <div class="timing-tower">
        <div class="timing-header">
            <div class="session-name" id="track-name">European Masters Series</div>
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span>DIRECTO</span>
            </div>
        </div>



        <div class="session-title-container" style="display: flex; justify-content: space-between; align-items: center; background-color: #003040; border-bottom: 2px solid #00b4c8; padding: 5px 10px;">
            <div class="session-title" id="session-name" style="border-bottom: none; background-color: transparent; padding: 0;">CLASIFICACIÓN</div>
            <div class="session-time" id="session-time" style="font-family: 'Orbitron', sans-serif; font-weight: bold; color: #ffffff;">--:--</div>
        </div>
        <div class="timing-columns-header" id="columns-header">
            <!-- La cabecera de columnas se generará con JavaScript -->
        </div>
        <div id="timing-rows" class="timing-container">
            <!-- Las filas de datos se generarán con JavaScript -->
        </div>
        <div class="sponsors-section">
            <div class="sponsor-item">
                <img src="/static/EUROPEANMASTERSERIES3D.png" alt="Sponsor 1">
            </div>
            <div class="sponsor-item">
                www.europeanseries.com
            </div>
            <div class="sponsor-item">
                <img src="/static/m25.png" alt="Sponsor 4">
            </div>
        </div>
    </div>

    <!-- Focused Driver Card — populated by JS -->
    <div id="focused-driver-info"></div>

    <div class="connection-status-container">
        <span class="connection-status disconnected" id="connection-indicator"></span>
        <span id="connection-status">Desconectado</span>
    </div>

    <script src="/static/timing.js"></script>
</body>

</html>
