<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iRacing Timing Tower - Controles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #f0f0f0;
            font-family: 'Roboto', sans-serif;
            padding: 20px;
        }
        
        .controls-panel {
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        
        .form-check-input:checked {
            background-color: #1e88e5;
            border-color: #1e88e5;
        }
        
        .column-item {
            background-color: rgba(50, 50, 50, 0.7);
            border-radius: 8px;
            padding: 8px; /* Reduced padding */
            margin-bottom: 5px; /* Reduced margin */
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        #column-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px; /* Gap between items */
        }

        .column-item {
            flex: 1 1 calc(33.333% - 10px); /* Three columns per row, adjust as needed */
            max-width: calc(33.333% - 10px); /* Ensure max width for three columns */
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        /* Adjust for smaller screens if necessary */
        @media (max-width: 768px) {
            .column-item {
                flex: 1 1 calc(50% - 10px); /* Two columns on medium screens */
                max-width: calc(50% - 10px);
            }
        }

        @media (max-width: 576px) {
            .column-item {
                flex: 1 1 100%; /* Single column on small screens */
                max-width: 100%;
            }
        }
        
        .column-item:hover {
            background-color: rgba(60, 60, 60, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .column-item.active {
            border-left-color: #1e88e5;
        }
        
        .preset-btn {
            background-color: rgba(50, 50, 50, 0.7);
            color: #f0f0f0;
            border: none;
            border-radius: 5px;
            padding: 8px 15px;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .preset-btn:hover {
            background-color: rgba(70, 70, 70, 0.9);
            transform: translateY(-2px);
        }
        
        .preset-btn.active {
            background-color: #1e88e5;
            color: white;
        }
        
        .apply-btn {
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        
        .apply-btn:hover {
            background: linear-gradient(135deg, #1976d2, #0d47a1);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.3);
        }
        
        .nav-link {
            color: #f0f0f0;
            text-decoration: none;
            background-color: rgba(30, 30, 30, 0.9);
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background-color: #3a3a3a;
            color: #ffffff;
        }
        
        .status-message {
            padding: 10px 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }
        
        .status-success {
            background-color: rgba(76, 175, 80, 0.2);
            border-left: 4px solid #4CAF50;
        }
        
        .status-error {
            background-color: rgba(244, 67, 54, 0.2);
            border-left: 4px solid #F44336;
        }
        
        .column-description {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row mb-3">
            <div class="col-12">
                <h1>Configuración de Columnas</h1>
                <a href="/config" class="nav-link">
                    <i class="fas fa-arrow-left"></i> Volver a Config Home
                </a>
                <a href="/" class="nav-link">
                    <i class="fas fa-arrow-left"></i> Volver a Timing Tower
                </a>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8 col-md-10 mx-auto">
                <div class="controls-panel">
                    <h4 class="mb-4">Personalizar Columnas</h4>

                    <div class="mb-4">
                        <h5>Formato de Nombres de Pilotos</h5>
                        <div class="d-flex flex-wrap mb-3">
                            <div class="form-check me-4">
                                <input class="form-check-input" type="radio" name="nameFormat" id="format-full" value="full" checked>
                                <label class="form-check-label" for="format-full">
                                    Nombre Completo
                                </label>
                            </div>
                            <div class="form-check me-4">
                                <input class="form-check-input" type="radio" name="nameFormat" id="format-initial-last" value="initial_last">
                                <label class="form-check-label" for="format-initial-last">
                                    I.Apellido
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="nameFormat" id="format-three-letters" value="three_letters">
                                <label class="form-check-label" for="format-three-letters">
                                    3 Letras (F1)
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <h5>Focused Driver</h5>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" role="switch" id="focused-driver-toggle">
                            <label class="form-check-label" for="focused-driver-toggle">
                                Habilitar Piloto Enfocado
                            </label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" role="switch" id="show-focused-driver-team-logo-toggle">
                            <label class="form-check-label" for="show-focused-driver-team-logo-toggle">
                                Mostrar Logo de Equipo del Piloto Enfocado
                            </label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="focused-driver-battle-mode-toggle">
                            <label class="form-check-label" for="focused-driver-battle-mode-toggle">
                                Comparativa con rival cercano (P1/P2) en carrera
                            </label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <h5>Presets Rápidos</h5>
                        <div class="d-flex flex-wrap">
                            <button class="preset-btn" data-preset="practice">
                                <i class="fas fa-stopwatch"></i> Práctica
                            </button>
                            <button class="preset-btn" data-preset="qualifying">
                                <i class="fas fa-tachometer-alt"></i> Clasificación
                            </button>
                            <button class="preset-btn" data-preset="race">
                                <i class="fas fa-flag-checkered"></i> Carrera
                            </button>
                            <button class="preset-btn" data-preset="results">
                                <i class="fas fa-trophy"></i> Resultados
                            </button>
                        </div>
                    </div>

                    <h5 class="mb-3">Seleccionar Columnas</h5>
                    <div id="column-items" class="mb-4">
                        <!-- Las columnas se generarán con JavaScript -->
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button class="apply-btn" id="apply-columns">
                            <i class="fas fa-save"></i> Aplicar Cambios
                        </button>
                    </div>

                    <div id="status-message" class="status-message">
                        <!-- Mensajes de estado se mostrarán aquí -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Definiciones de columnas y traducciones
        const columnDefinitions = {
            position: {
                name: "Posición",
                description: "Posición actual del piloto en la clasificación",
                width: 1
            },
            carNumber: {
                name: "Número",
                description: "Número del coche del piloto",
                width: 1
            },
            userName: {
                name: "Piloto",
                description: "Nombre del piloto",
                width: 3
            },
            teamName: {
                name: "Equipo",
                description: "Nombre del equipo (si está disponible)",
                width: 3
            },
            carName: {
                name: "Coche",
                description: "Modelo del coche",
                width: 2
            },
            bestLapTime: {
                name: "Mejor Vuelta",
                description: "Mejor tiempo de vuelta del piloto",
                width: 2
            },
            lastLapTime: {
                name: "Última Vuelta",
                description: "Tiempo de la última vuelta completada",
                width: 2
            },
            lapsComplete: {
                name: "Vueltas",
                description: "Número de vueltas completadas",
                width: 1
            },
            interval: {
                name: "Intervalo",
                description: "Diferencia de tiempo con el piloto anterior",
                width: 2
            },
            gap: {
                name: "Gap",
                description: "Diferencia de tiempo con el líder",
                width: 2
            },
            pitstops: {
                name: "Pitstops",
                description: "Número de paradas en boxes",
                width: 1
            },
            iRating: {
                name: "iRating",
                description: "Puntuación iRating del piloto",
                width: 1
            },
            brands: {
                name: "Marca",
                description: "Marca del vehículo del piloto",
                width: 0.6
            },
            teamLogo: {
                name: "Logo Equipo",
                description: "Logo del equipo del piloto",
                width: 0.6
            },
            sectors: {
                name: "sectors",
                description: "Sectores del piloto",
                width: 0.6
            },
            onPitRoad: {
                name: "Pits",
                description: "Indicador de si el piloto está en boxes o abandonado",
                width: 0.8
            }
        };

        // Presets de columnas para diferentes tipos de sesión
        const columnPresets = {
            practice: [
                "position", "carNumber", "userName", "bestLapTime", "lastLapTime", "interval", "gap"
            ],
            qualifying: [
                "position", "brands", "carNumber", "userName", "bestLapTime", "lastLapTime", "interval", "gap"
            ],
            race: [
                "position", "brands", "carNumber", "userName", "interval", "gap", "lapsComplete", "bestLapTime"
            ],
            results: [
                "position", "carNumber", "userName", "lapsComplete", "bestLapTime", "interval", "gap"
            ]
        };

        // Variables de estado
        let availableColumns = [];
        let activeColumns = [];

        // Inicializar la página
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // Cargar datos de columnas
                const columnsResponse = await fetch('/api/columns');
                const columnsData = await columnsResponse.json();

                if (columnsData.success) {
                    availableColumns = columnsData.availableColumns;
                    activeColumns = columnsData.activeColumns;

                    // Generar elementos de columna
                    generateColumnItems();

                    // Detectar qué preset está activo
                    detectActivePreset();
                }

                // Cargar formato de nombres de pilotos
                const formatResponse = await fetch('/api/driver-name-format');
                const formatData = await formatResponse.json();

                if (formatData.success) {
                    const formatRadio = document.querySelector(`input[name="nameFormat"][value="${formatData.format}"]`);
                    if (formatRadio) {
                        formatRadio.checked = true;
                    }
                }

                // Cargar estado de focused driver
                const configResponse = await fetch('/api/columns');
                const configData = await configResponse.json();
                if (configData.success) {
                    const focusedDriverToggle = document.getElementById('focused-driver-toggle');
                    if (focusedDriverToggle && configData.focusedDriverEnabled !== undefined) {
                        focusedDriverToggle.checked = configData.focusedDriverEnabled;
                    }

                    const showLogoToggle = document.getElementById('show-focused-driver-team-logo-toggle');
                    if (showLogoToggle && configData.showFocusedDriverTeamLogo !== undefined) {
                        showLogoToggle.checked = configData.showFocusedDriverTeamLogo;
                    }

                    const battleModeToggle = document.getElementById('focused-driver-battle-mode-toggle');
                    if (battleModeToggle && configData.focusedDriverBattleMode !== undefined) {
                        battleModeToggle.checked = configData.focusedDriverBattleMode;
                    }
                }

                // Configurar eventos de botones
                document.getElementById('apply-columns').addEventListener('click', applyColumnChanges);

                // Configurar eventos para los botones de formato de nombre
                document.querySelectorAll('input[name="nameFormat"]').forEach(radio => {
                    radio.addEventListener('change', updateDriverNameFormat);
                });

                // Configurar eventos para los presets
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const preset = this.getAttribute('data-preset');
                        applyPreset(preset);

                        // Actualizar UI para mostrar el preset activo
                        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                    });
                });

                // Configurar evento para el toggle de focused driver
                document.getElementById('focused-driver-toggle').addEventListener('change', function() {
                    const enabled = this.checked;
                    fetch('/api/toggle-focused-driver', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                enabled: enabled
                            }),
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                showStatusMessage(`Focused driver ${enabled ? 'enabled' : 'disabled'}`, true);
                            } else {
                                showStatusMessage("Error updating focused driver setting", false);
                                this.checked = !enabled; // Revert UI on error
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            showStatusMessage("Connection error updating focused driver setting", false);
                            this.checked = !enabled; // Revert UI on error
                        });
                });

                // Configurar evento para el toggle de mostrar logo de equipo del piloto enfocado
                document.getElementById('show-focused-driver-team-logo-toggle').addEventListener('change', function() {
                    const enabled = this.checked;
                    fetch('/api/toggle-focused-driver-team-logo', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                enabled: enabled
                            }),
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                showStatusMessage(`Mostrar logo de equipo del piloto enfocado ${enabled ? 'habilitado' : 'deshabilitado'}`, true);
                            } else {
                                showStatusMessage("Error al actualizar la configuración del logo de equipo del piloto enfocado", false);
                                this.checked = !enabled; // Revert UI on error
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            showStatusMessage("Error de conexión al actualizar la configuración del logo de equipo del piloto enfocado", false);
                            this.checked = !enabled; // Revert UI on error
                        });
                });

                // Configurar evento para el toggle de comparativa (modo batalla) del piloto enfocado
                document.getElementById('focused-driver-battle-mode-toggle').addEventListener('change', function() {
                    const enabled = this.checked;
                    fetch('/api/toggle-focused-driver-battle-mode', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                enabled: enabled
                            }),
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                showStatusMessage(`Comparativa con rival cercano ${enabled ? 'habilitada' : 'deshabilitada'}`, true);
                            } else {
                                showStatusMessage("Error al actualizar la comparativa del piloto enfocado", false);
                                this.checked = !enabled; // Revert UI on error
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            showStatusMessage("Error de conexión al actualizar la comparativa del piloto enfocado", false);
                            this.checked = !enabled; // Revert UI on error
                        });
                });

            } catch (error) {
                console.error('Error al inicializar:', error);
                showStatusMessage('Error al cargar la configuración inicial', false);
            }
        });


        // Actualizar el formato de nombres de pilotos
        function updateDriverNameFormat() {
            const selectedFormat = document.querySelector('input[name="nameFormat"]:checked').value;

            fetch('/api/update-driver-name-format', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        format: selectedFormat
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showStatusMessage(`Formato de nombres de pilotos actualizado a "${getFormatName(selectedFormat)}"`, true);
                    } else {
                        showStatusMessage("Error al actualizar formato: " + (data.error || "Error desconocido"), false);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showStatusMessage("Error de conexión al actualizar formato.", false);
                });
        }

        // Obtener nombre legible del formato
        function getFormatName(format) {
            const names = {
                'full': 'Nombre Completo',
                'initial_last': 'I.Apellido',
                'three_letters': '3 Letras (F1)'
            };
            return names[format] || format;
        }

        // Obtener datos de columnas del servidor
        async function fetchColumnData() {
            try {
                // Obtener columnas disponibles y activas
                const response = await fetch('/api/columns');
                const data = await response.json();

                if (data.success) {
                    availableColumns = data.availableColumns;
                    activeColumns = data.activeColumns;

                    // Generar elementos de columna
                    generateColumnItems();

                    // Detectar qué preset está activo
                    detectActivePreset();
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }

                // Obtener formato de nombres
                const formatResponse = await fetch('/api/driver-name-format');
                const formatData = await formatResponse.json();

                if (formatData.success) {
                    const formatRadio = document.querySelector(`input[name="nameFormat"][value="${formatData.format}"]`);
                    if (formatRadio) {
                        formatRadio.checked = true;
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                showStatusMessage('Error al cargar datos de columnas: ' + error.message, false);
            }
        }

        // Generar elementos de columna en la UI
        function generateColumnItems() {
            const container = document.getElementById('column-items');
            if (!container) {
                console.error('No se encontró el contenedor de columnas');
                return;
            }

            container.innerHTML = '';

            if (!Array.isArray(availableColumns)) {
                console.error('availableColumns no es un array:', availableColumns);
                return;
            }

            availableColumns.forEach(column => {
                const colDef = columnDefinitions[column] || {
                    name: column,
                    description: "Columna personalizada",
                    width: 2
                };

                const isActive = Array.isArray(activeColumns) && activeColumns.includes(column);

                const div = document.createElement('div');
                div.className = `column-item ${isActive ? 'active' : ''}`;
                div.setAttribute('data-column', column);

                const content = `
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="column-${column}" 
                               ${isActive ? 'checked' : ''}>
                        <label class="form-check-label" for="column-${column}">
                            <strong>${colDef.name}</strong>
                        </label>
                        <div class="column-description">${colDef.description}</div>
                    </div>
                `;

                div.innerHTML = content;
                container.appendChild(div);

                // Añadir evento de clic para toda la fila
                div.addEventListener('click', function(e) {
                    // No activar si se hizo clic directamente en el checkbox
                    if (e.target.type !== 'checkbox') {
                        const checkbox = this.querySelector('input[type="checkbox"]');
                        if (checkbox) {
                            checkbox.checked = !checkbox.checked;
                            // Actualizar clase active
                            this.classList.toggle('active', checkbox.checked);
                        }
                    } else {
                        // Actualizar clase active basado en el estado del checkbox
                        this.classList.toggle('active', e.target.checked);
                    }
                });
            });
        }

        // Aplicar un preset de columnas
        function applyPreset(preset) {
            if (columnPresets[preset]) {
                // Actualizar checkboxes según el preset
                document.querySelectorAll('.column-item').forEach(item => {
                    const column = item.getAttribute('data-column');
                    const checkbox = item.querySelector('input[type="checkbox"]');
                    const isInPreset = columnPresets[preset].includes(column);

                    checkbox.checked = isInPreset;
                    item.classList.toggle('active', isInPreset);
                });

                showStatusMessage(`Preset de ${getPresetName(preset)} aplicado. Haz clic en "Aplicar Cambios" para guardar.`, true);
            }
        }

        // Detectar qué preset está activo basado en las columnas seleccionadas
        function detectActivePreset() {
            for (const [preset, columns] of Object.entries(columnPresets)) {
                // Comprobar si las columnas activas coinciden exactamente con el preset
                if (arraysEqual(activeColumns, columns)) {
                    document.querySelector(`.preset-btn[data-preset="${preset}"]`).classList.add('active');
                    break;
                }
            }
        }

        // Aplicar cambios de columnas
        function applyColumnChanges() {
            const checkboxes = document.querySelectorAll('.column-item input[type="checkbox"]:checked');
            const newColumns = Array.from(checkboxes).map(cb => cb.closest('.column-item').getAttribute('data-column'));

            if (newColumns.length === 0) {
                showStatusMessage("Debes seleccionar al menos una columna.", false);
                return;
            }

            // Enviar selección al servidor
            fetch('/api/update-columns', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        columns: newColumns
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        activeColumns = data.activeColumns;
                        showStatusMessage("Cambios aplicados correctamente. Los cambios se aplicarán automáticamente en la página de timing.", true);

                        // Detectar si coincide con algún preset
                        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
                        detectActivePreset();

                        // Mostrar información sobre la sincronización
                        const statusElement = document.getElementById('status-message');
                        const syncInfo = document.createElement('div');
                        syncInfo.className = 'mt-2';
                        syncInfo.innerHTML = '<small><i class="fas fa-sync-alt"></i> La configuración se sincroniza automáticamente con la página de timing.</small>';
                        statusElement.appendChild(syncInfo);
                    } else {
                        showStatusMessage("Error al aplicar cambios: " + (data.error || "Error desconocido"), false);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showStatusMessage("Error de conexión al aplicar cambios.", false);
                });
        }

        // Mostrar mensaje de estado
        function showStatusMessage(message, isSuccess) {
            const statusElement = document.getElementById('status-message');
            statusElement.textContent = message;
            statusElement.className = 'status-message ' + (isSuccess ? 'status-success' : 'status-error');
            statusElement.style.display = 'block';

            // Ocultar después de 5 segundos
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 5000);
        }

        // Obtener nombre legible del preset
        function getPresetName(preset) {
            const names = {
                'practice': 'Práctica',
                'qualifying': 'Clasificación',
                'race': 'Carrera',
                'results': 'Resultados'
            };
            return names[preset] || preset;
        }

        // Comparar si dos arrays son iguales (mismo contenido, mismo orden)
        function arraysEqual(a, b) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }
    </script>
</body>

</html>
